<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesh Update</title>
<link rel="stylesheet" href="/style/update.css">
</head>
<body>
<div class="container">

  <h1>Mesh Update</h1>
  <p class="subtitle">OTA FIRMWARE FLASH</p>

  <!-- Target selection -->
  <div class="card">
    <div class="card-title">Target</div>
    <div class="target-row">
      <label class="target-opt selected" id="opt-this">
        <input type="radio" name="target" value="this" checked
               onchange="selectTarget(this)">
        <span class="radio-dot"></span>
        <div>
          <div class="target-label">This Node</div>
          <div class="target-desc">Flash only this device</div>
        </div>
      </label>
      <label class="target-opt" id="opt-all">
        <input type="radio" name="target" value="all"
               onchange="selectTarget(this)">
        <span class="radio-dot"></span>
        <div>
          <div class="target-label">All Nodes</div>
          <div class="target-desc">Broadcast to entire mesh</div>
        </div>
      </label>
    </div>
  </div>

  <!-- Credentials + file -->
  <div class="card">
    <div class="card-title">Credentials</div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="pw" placeholder="OTA password"
             oninput="validate()" autocomplete="current-password">
    </div>
  </div>

  <div class="card">
    <div class="card-title">Firmware</div>
    <div class="field">
      <div class="dropzone" id="dropzone">
        <input type="file" id="fw-file" accept=".bin"
               onchange="onFileChange(this)">
        <div class="dz-icon">📦</div>
        <div class="dz-label">Click to select .bin file</div>
        <div class="dz-name" id="dz-name"></div>
      </div>
    </div>
  </div>

  <!-- Flash button -->
  <button id="flash-btn" disabled onclick="startFlash()">Flash Firmware</button>

  <!-- Status -->
  <div class="status-card" id="status-card">
    <div class="status-label">Status</div>
    <div class="status-text" id="status-text">Idle</div>
    <div class="progress-track">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="detail-row">
      <span id="detail-left">—</span>
      <span id="detail-right">—</span>
    </div>
  </div>

  <nav class="nav">
    <a href="/">Chat</a>
    <a href="/nodes">Nodes</a>
  </nav>
</div>

<script>
(function(){
  var targetVal  = 'this';
  var fileSelected = false;
  var polling    = null;

  function selectTarget(radio) {
    targetVal = radio.value;
    document.getElementById('opt-this').classList.toggle('selected', targetVal === 'this');
    document.getElementById('opt-all').classList.toggle('selected',  targetVal === 'all');
    validate();
  }
  window.selectTarget = selectTarget;

  function onFileChange(input) {
    fileSelected = input.files && input.files.length > 0;
    var nameEl = document.getElementById('dz-name');
    var dz     = document.getElementById('dropzone');
    if (fileSelected) {
      nameEl.textContent = input.files[0].name;
      dz.classList.add('has-file');
    } else {
      nameEl.textContent = '';
      dz.classList.remove('has-file');
    }
    validate();
  }
  window.onFileChange = onFileChange;

  function validate() {
    var pw = document.getElementById('pw').value;
    document.getElementById('flash-btn').disabled = !(pw && fileSelected);
  }
  window.validate = validate;

  function setStatus(text, pct, left, right, cls) {
    var card = document.getElementById('status-card');
    card.classList.add('visible');
    var st = document.getElementById('status-text');
    st.className   = 'status-text' + (cls ? ' ' + cls : '');
    st.textContent = text;
    document.getElementById('progress-bar').style.width = (pct || 0) + '%';
    document.getElementById('detail-left').textContent  = left  || '—';
    document.getElementById('detail-right').textContent = right || '—';
  }

  function pollStatus() {
    fetch('/ota/status').then(function(r){ return r.json(); }).then(function(s) {
      switch (s.state) {
        case 'uploading':
          setStatus('Uploading firmware…', s.uploadPct,
                    s.uploadPct + '%', 'upload');
          break;
        case 'distributing':
          var pct = s.totalChunks > 0
            ? Math.round(s.sentChunks / s.totalChunks * 100) : 0;
          setStatus('Distributing to mesh…', pct,
                    s.sentChunks + ' / ' + s.totalChunks + ' chunks',
                    s.ackedNodes + ' / ' + s.peerCount + ' ACKs');
          break;
        case 'flashing':
          setStatus('Flashing…', 90, 'writing firmware', '');
          break;
        case 'done':
          setStatus('Done! Rebooting…', 100, '', '', 'status-ok');
          clearInterval(polling);
          polling = null;
          setTimeout(function(){ window.location.reload(); }, 6000);
          break;
        case 'error':
          setStatus('Error: ' + (s.errMsg || 'unknown'), 0, '', '', 'status-error');
          clearInterval(polling);
          polling = null;
          document.getElementById('flash-btn').disabled = false;
          break;
        default:
          /* idle — stop polling */
          clearInterval(polling);
          polling = null;
      }
    }).catch(function(){});
  }

  function startFlash() {
    var pw   = document.getElementById('pw').value;
    var file = document.getElementById('fw-file').files[0];
    if (!pw || !file) return;

    document.getElementById('flash-btn').disabled = true;
    setStatus('Uploading…', 0, '0%', file.name);

    var fd = new FormData();
    fd.append('firmware', file, file.name);

    var xhr = new XMLHttpRequest();
    xhr.open('POST',
      '/update?pw=' + encodeURIComponent(pw)
              + '&target=' + encodeURIComponent(targetVal));

    /* upload progress */
    xhr.upload.addEventListener('progress', function(e) {
      if (e.lengthComputable) {
        var pct = Math.round(e.loaded / e.total * 100);
        setStatus('Uploading firmware…', pct, pct + '%', file.name);
      }
    });

    xhr.onload = function() {
      if (xhr.status === 200) {
        try {
          var resp = JSON.parse(xhr.responseText);
          if (resp.status === 'ok_restart') {
            setStatus('Flashing & Rebooting…', 95, '', '', 'status-ok');
            /* This node reboots; page will be unavailable briefly */
            setTimeout(function(){ window.location.reload(); }, 8000);
          } else {
            /* distributing — start polling */
            polling = setInterval(pollStatus, 800);
            pollStatus();
          }
        } catch(e) {
          setStatus('Upload done — rebooting…', 100, '', '');
          setTimeout(function(){ window.location.reload(); }, 7000);
        }
      } else {
        var msg = 'Upload failed (' + xhr.status + ')';
        try { var j = JSON.parse(xhr.responseText); msg = j.error || msg; } catch(e2){}
        setStatus(msg, 0, '', '', 'status-error');
        document.getElementById('flash-btn').disabled = false;
      }
    };

    xhr.onerror = function() {
      setStatus('Network error during upload', 0, '', '', 'status-error');
      document.getElementById('flash-btn').disabled = false;
    };

    xhr.send(fd);
  }
  window.startFlash = startFlash;
})();
</script>
</body>
</html>
